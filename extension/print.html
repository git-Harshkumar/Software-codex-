<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RecallAI Lecture Notes — Save as PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Kalam:wght@300;400;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <style>
    @page { margin: 15mm; size: A4 portrait; }
    *, *::before, *::after { box-sizing: border-box; }

    /* Non-printable top action bar */
    #rc-print-bar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999999;
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 13px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .rc-pbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .rc-pbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .rc-pbar-btn-primary {
      background: #2563eb;
      color: #fff;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .rc-pbar-btn-primary:hover {
      background: #1d4ed8;
    }
    .rc-pbar-btn-secondary {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .rc-pbar-btn-secondary:hover {
      background: #475569;
    }

    @media print {
      #rc-print-bar {
        display: none !important;
      }
      body {
        padding: 0 !important;
        background: transparent !important;
      }
    }

    /* Printable document body */
    body {
      font-family: 'Kalam', 'Noto Sans Devanagari', cursive, sans-serif;
      font-size: 15px;
      line-height: 1.85;
      color: #0f172a;
      background: #ffffff;
      padding: 24px;
      max-width: 860px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #1e3a8a;
      border-bottom: 2px solid #3b82f6;
      padding-bottom: 8px;
      margin: 20px 0 20px;
    }
    h2 {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #1d4ed8;
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 8px 14px;
      margin: 24px 0 12px;
      border-radius: 0 6px 6px 0;
      page-break-after: avoid;
    }
    h3 {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #334155;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 4px;
      margin: 18px 0 8px;
      page-break-after: avoid;
    }
    p { margin-bottom: 12px; }
    ul, ol { margin: 6px 0 14px 26px; }
    li { margin-bottom: 5px; }

    /* Important Timeline in PDF */
    .rc-timeline-card {
      margin: 20px 0 26px;
      background: #f8fafc;
      border: 1.5pt solid #3b82f6;
      border-radius: 10px;
      overflow: hidden;
      page-break-inside: avoid;
    }
    .rc-timeline-header {
      background: #eff6ff;
      padding: 10px 16px;
      border-bottom: 1.5pt solid #bfdbfe;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .rc-timeline-title {
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rc-timeline-count-badge {
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid #bfdbfe;
    }
    .rc-timeline-subtitle {
      font-size: 11.5px;
      color: #475569;
      margin: 8px 16px 10px;
      font-style: italic;
    }
    .rc-timeline-table-wrap {
      padding: 0 16px 14px;
      overflow-x: auto;
    }
    .rc-timeline-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .rc-timeline-table th {
      background: #f1f5f9;
      padding: 7px 12px;
      border-bottom: 1.5pt solid #cbd5e1;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: #1e293b;
      text-align: left;
    }
    .rc-timeline-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }
    .rc-timeline-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      background: #eff6ff;
      color: #2563eb !important;
      border: 1px solid #93c5fd;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
    }
    .rc-timeline-topic {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #0f172a;
      display: block;
    }
    .rc-timeline-desc {
      font-size: 11.5px;
      color: #64748b;
      margin-top: 2px;
      line-height: 1.4;
    }
    .rc-timeline-jump-link {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      color: #2563eb !important;
      text-decoration: underline;
    }

    /* Timestamps */
    .rc-timestamp {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      background: #eff6ff;
      color: #2563eb !important;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
    }

    /* Code & Diagrams */
    .rc-code-container { background: #0f172a; border-radius: 8px; margin: 14px 0; overflow: hidden; border: 1px solid #334155; page-break-inside: avoid; }
    .rc-code-header { background: #1e293b; color: #94a3b8; font-size: 11px; font-weight: 600; padding: 6px 14px; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; font-family: 'Inter', sans-serif; }
    .rc-code-copy-btn { display: none; }
    .rc-code-pre { margin: 0; padding: 12px 14px; color: #f8fafc; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.55; overflow-x: auto; }
    .rc-inline-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; background: #f1f5f9; color: #0369a1; padding: 2px 6px; border-radius: 4px; }
    .rc-diagram-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; margin: 14px 0; overflow: hidden; page-break-inside: avoid; }
    .rc-diagram-box-header { background: #e2e8f0; color: #334155; font-size: 11px; font-weight: 700; padding: 6px 12px; font-family: 'Inter', sans-serif; }
    .rc-ascii-art { font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.4; padding: 12px; margin: 0; color: #1e293b; overflow-x: auto; }

    /* Visual Figures */
    .rc-figure-card { margin: 16px 0; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; page-break-inside: avoid; }
    .rc-figure-badge { background: #eff6ff; color: #1d4ed8; font-size: 11px; font-weight: 700; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; font-family: 'Inter', sans-serif; border-bottom: 1px solid #e2e8f0; }
    .rc-expand-card-btn { display: none; }
    .rc-figure-img { width: 100%; max-height: 380px; object-fit: contain; background: #000; display: block; }
    .rc-figure-caption { padding: 8px 14px; font-size: 12px; color: #475569; font-style: italic; border-top: 1px solid #e2e8f0; background: #fff; }

    /* SVG Cards */
    .rc-graph-card { margin: 16px 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; page-break-inside: avoid; }
    .rc-graph-header { background: #eff6ff; color: #1e40af; font-size: 11px; font-weight: 700; padding: 6px 12px; font-family: 'Inter', sans-serif; display: flex; justify-content: space-between; }
    .rc-graph-expand-btn { display: none; }
    .rc-graph-viewport { padding: 14px; display: flex; justify-content: center; background: #f8fafc; }
    .rc-code-visual-split { margin: 16px 0; border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; page-break-inside: avoid; }
    .rc-split-nav { display: none; }
    .rc-split-panes { display: flex; flex-direction: column; }

    /* Callouts */
    .rc-callout { display: flex; gap: 12px; padding: 12px 16px; margin: 14px 0; border-radius: 8px; page-break-inside: avoid; }
    .rc-callout-intuition { background: #f0fdf4; border-left: 4px solid #22c55e; color: #14532d; }
    .rc-callout-warning { background: #fffbeb; border-left: 4px solid #f59e0b; color: #78350f; }
    .rc-callout-exam { background: #faf5ff; border-left: 4px solid #a855f7; color: #581c87; }
    .rc-callout-default { background: #f8fafc; border-left: 4px solid #64748b; color: #1e293b; }
    .rc-callout-body { font-size: 13.5px; line-height: 1.6; }

    /* Tables */
    .rc-table-wrapper { margin: 14px 0; overflow-x: auto; }
    .rc-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .rc-table th { background: #f1f5f9; padding: 8px 12px; border: 1px solid #cbd5e1; font-family: 'Inter', sans-serif; font-weight: 700; color: #1e293b; text-align: left; }
    .rc-table td { padding: 8px 12px; border: 1px solid #cbd5e1; color: #334155; }

    /* Math */
    .rc-math-inline { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0284c7; background: #f0f9ff; padding: 1px 4px; border-radius: 4px; }
    .rc-math-block { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #0369a1; background: #f0f9ff; border-left: 3px solid #0284c7; padding: 8px 14px; margin: 10px 0; border-radius: 0 6px 6px 0; }
  </style>
</head>
<body>
  <div id="rc-print-bar">
    <div class="rc-pbar-left">
      <strong id="rc-pbar-title">RecallAI Notes</strong>
      <span style="color:#94a3b8;font-size:12px;">Destination: <b>Save as PDF</b> &bull; Timestamps are clickable video links</span>
    </div>
    <div class="rc-pbar-actions">
      <button class="rc-pbar-btn-primary" id="rc-open-studio-btn" style="background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-color:#a78bfa;">✏️ Edit in Notes Studio</button>
      <button class="rc-pbar-btn-primary" id="rc-print-btn">Save as PDF</button>
      <button class="rc-pbar-btn-secondary" id="rc-close-btn">Close</button>
    </div>
  </div>

  <main id="rc-print-doc-container">
    <div style="text-align:center;padding:40px;color:#64748b;font-family:'Inter',sans-serif;">
      Loading notes…
    </div>
  </main>

  <script src="print.js"></script>
</body>
</html>
